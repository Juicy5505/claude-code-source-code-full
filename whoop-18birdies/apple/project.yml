name: WhoopGolf

options:
  bundleIdPrefix: com.alex
  deploymentTarget:
    iOS: "17.0"
    watchOS: "9.0"
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

schemes:
  WhoopGolf:
    shared: true
    build:
      targets:
        WhoopGolf: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WhoopGolfTests
    archive:
      config: Release
  WhoopGolfWatch:
    shared: true
    build:
      targets:
        WhoopGolfWatch: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  WhoopGolf:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhoopGolf
      - path: Shared
      - path: Resources
      - path: WatchSupport/WatchSessionReceiver.swift
        group: WatchSupport
    dependencies:
      - target: WhoopGolfWatch
        embed: true
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.whoopgolf
        PRODUCT_MODULE_NAME: WhoopGolf
        PRODUCT_NAME: WhoopGolf
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: WhoopGolf/Info.plist
      properties:
        CFBundleDisplayName: WHOOP Golf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: WHOOP Golf reads authorized workouts and heart-rate data to explain golf performance.
        NSHealthUpdateUsageDescription: WHOOP Golf can optionally export a finished golf workout after its protected local round is saved.
        NSLocationWhenInUseUsageDescription: WHOOP Golf records a timestamped GPS trail during an active round so later WHOOP swing events can be matched to approximate shot positions and displacement.
        NSLocationAlwaysAndWhenInUseUsageDescription: WHOOP Golf continues the timestamped GPS trail only while your saved round is active, including when the screen is locked or the app is in the background, so delayed WHOOP swing observations can be matched to approximate shot positions.
        NSBluetoothAlwaysUsageDescription: WHOOP Golf connects to a WHOOP strap for heart-rate broadcast and optional live wrist motion. The official WHOOP app should be closed before a live IMU connection.
        UIBackgroundModes:
          - location
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: WhoopGolf/WhoopGolf.entitlements
      properties:
        com.apple.developer.healthkit: true

  WhoopGolfWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: ../watch/WhoopGolfWatchApp
      - path: WatchSupport
        excludes:
          - WatchSessionReceiver.swift
      # Watch allowlist only — do NOT add Shared/ wholesale or iPhone-only Shared
      # (ComprehensiveShotIntelligence, DualWearableRequirement, GolfModels,
      # PhoneYardageBridge, StrokeScoreShotChain, SensorModeCoordinator, …).
      - path: Shared/WatchCoachingCue.swift
      - path: Shared/WatchRoundContext.swift
      - path: Shared/WatchLiveFace.swift
      - path: Shared/WatchWristPreference.swift
      - path: Shared/SwingPathGuidance.swift
      - path: Shared/GolfImprover.swift
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.whoopgolf.watchkitapp
        PRODUCT_MODULE_NAME: WhoopGolfWatch
        PRODUCT_NAME: WhoopGolfWatch
        SKIP_INSTALL: YES
    info:
      path: WatchSupport/Info.plist
      properties:
        CFBundleDisplayName: WHOOP Golf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.alex.whoopgolf
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: WHOOP Golf reads heart rate during a golf workout.
        NSHealthUpdateUsageDescription: WHOOP Golf saves your round as a golf workout and attaches its route.
        NSMotionUsageDescription: WHOOP Golf uses wrist motion to detect golf swings and tempo.
        NSLocationWhenInUseUsageDescription: WHOOP Golf uses GPS during a round to measure shot-to-shot distance and save the route.
    entitlements:
      path: WatchSupport/WhoopGolfWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  WhoopGolfTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhoopGolfTests
    dependencies:
      - target: WhoopGolf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.whoopgolf.tests
        GENERATE_INFOPLIST_FILE: YES
